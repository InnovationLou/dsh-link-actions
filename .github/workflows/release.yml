name: release

# Publishes the version in package.json when a v* tag lands, and on demand.
#
# Authentication is npm Trusted Publishing: GitHub mints an OIDC token for this
# job, npm exchanges it for a short-lived publish grant, and no long-lived npm
# token exists anywhere. That is also why the account's
# "require 2FA / disallow bypass tokens" setting stays intact — there is no
# token to bypass with.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Required for the OIDC token npm exchanges; without it there is no publish.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Show toolchain
        run: node --version && npm --version

      # A failed trusted-publish run splits in two: the OIDC request URL missing
      # (workflow permission or org policy) versus npm not finding the package's
      # trusted publisher (npm-side configuration). This tells them apart without
      # ever printing the token.
      - name: Confirm the OIDC request endpoint exists
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC request endpoint: present on ${{ github.repository }}@${{ github.ref_name }} (${{ github.workflow }})"
          else
            echo "OIDC request endpoint: MISSING — id-token: write did not take effect"
            exit 1
          fi

      # The bundle ships in the repository, so a release must not publish a
      # stale lib/: rebuild and fail when it differs from what is committed.
      - name: Verify the committed bundle matches src/
        run: |
          npm run check
          git diff --exit-code -- lib

      # Exercises the exact exchange npm performs, so a failure names its cause:
      # 404 = the package has no trusted publisher for this repository,
      # 401 = the entry exists but does not match this repo/workflow,
      # 200 = npm is configured correctly and the CLI is the problem.
      # Only the status and a redacted body are printed; the minted token never is.
      - name: Probe the npm OIDC exchange
        run: |
          set -euo pipefail
          oidc=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          jwt=$(printf '%s' "$oidc" | jq -r .value)
          code=$(curl -sS -o exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${jwt}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/dsh-link-actions")
          echo "exchange status: ${code}"
          jq -r 'if .token then "issued a publish token (redacted)" else (.error // .message // .) end' exchange.json
          if [ "${code}" != "200" ]; then
            echo "::warning::OIDC exchange returned ${code}; publishing cannot succeed until the trusted publisher matches this repository and workflow."
          fi

      - name: Publish with provenance
        run: npm publish --provenance --access public
